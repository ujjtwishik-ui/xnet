<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xnet — социальная сеть</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a href="/" class="logo">xnet<span>.id</span></a>
    <div class="nav-right" id="authArea"></div>
  </header>

  <main class="container">
    <form class="create-post" id="createPostBox" hidden>
      <h3>Создать пост</h3>
      <textarea id="postContent" maxlength="2000" placeholder="О чём думаете?" required></textarea>
      <input type="url" id="postImage" maxlength="2048" placeholder="Ссылка на картинку (необязательно)">
      <button class="btn btn-primary" type="submit">Опубликовать</button>
    </form>

    <div id="feed" aria-live="polite"></div>
    <button class="btn load-more" id="loadMore" hidden>Показать ещe</button>
  </main>

  <div class="modal-overlay" id="authModal" hidden>
    <form class="modal" id="authForm" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Вход в xnet</h2>
      <input type="text" id="authUsername" placeholder="Логин" autocomplete="username" required>
      <input type="password" id="authPassword" placeholder="Пароль" autocomplete="current-password" required>
      <p class="form-error" id="authError" role="alert"></p>
      <button class="btn btn-primary full" id="authSubmit" type="submit">Войти</button>
      <button class="btn full" id="authToggle" type="button">Нет аккаунта? Регистрация</button>
    </form>
  </div>

  <div class="toast" id="toast" role="status"></div>
</body>
</html>
