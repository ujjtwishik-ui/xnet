<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xnet - Социальная сеть</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #1a1a1a; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Навигация */
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 0 40px; height: 64px; background-color: #222; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 800; color: #fff; text-decoration: none; cursor: pointer;}
        .logo span { color: #6c5ce7; }
        .nav-links { display: flex; gap: 24px; height: 100%; }
        .nav-links a { color: #999; text-decoration: none; font-size: 15px; display: flex; align-items: center; height: 100%; border-bottom: 2px solid transparent; cursor: pointer; transition: 0.2s;}
        .nav-links a:hover { color: #fff; }
        .nav-links a.active { color: #fff; border-bottom-color: #6c5ce7; }
        
        .nav-right { display: flex; align-items: center; gap: 16px; position: relative; }
        .btn { background: #333; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;}
        .btn:hover { background: #444; }
        .btn-primary { background: #6c5ce7; }
        .btn-primary:hover { background: #5b4bc4; }

        /* Меню профиля */
        .profile-menu-container { position: relative; }
        .profile-trigger { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 12px; border-radius: 8px; transition: background 0.2s; }
        .profile-trigger:hover { background: #2a2a2a; }
        .profile-trigger img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover;}
        .dropdown-menu { position: absolute; top: 100%; right: 0; background: #242424; border: 1px solid #444; border-radius: 8px; width: 220px; padding: 8px; display: none; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.4); margin-top: 8px; }
        .dropdown-menu.active { display: flex; }
        .dropdown-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: #ccc; text-decoration: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .dropdown-item:hover { background: #333; color: #fff; }
        .dropdown-item svg { width: 18px; height: 18px; fill: currentColor; }
        .dropdown-divider { height: 1px; background: #333; margin: 6px 0; }

        /* Контент */
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; flex: 1; width: 100%; }
        
        /* Создание поста */
        .create-post { background: #242424; padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 24px; display: none; }
        .create-post.active { display: block; }
        .create-post textarea { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 10px; resize: vertical; min-height: 80px;}
        .file-upload-wrapper { margin-bottom: 15px; font-size: 14px; color: #aaa; }
        
        /* Посты */
        .post { background: #242424; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; overflow: hidden; }
        .post-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #888; border-bottom: 1px solid #333; }
        .post-author { color: #fff; font-weight: 600; cursor: pointer; }
        .post-author:hover { text-decoration: underline; }
        .delete-post-btn { background: none; border: none; color: #ff4757; cursor: pointer; opacity: 0.7; transition: 0.2s; padding: 5px;}
        .delete-post-btn:hover { opacity: 1; }
        .delete-post-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .post-img { width: 100%; max-height: 400px; object-fit: cover; display: block; }
        .post-content { padding: 15px; font-size: 15px; line-height: 1.5; }
        .post-footer { padding: 10px 15px; display: flex; gap: 20px; border-top: 1px solid #333; background: #202020; align-items: center; }
        .action-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
        .action-btn:hover { color: #fff; }
        .action-btn img, .action-btn svg { width: 18px; height: 18px; opacity: 0.7; transition: opacity 0.2s; fill: currentColor;}
        .action-btn:hover img, .action-btn:hover svg { opacity: 1; }
        .action-btn.liked { color: #ff4757; }

        /* Комментарии */
        .comments-section { display: none; padding: 15px; background: #1e1e1e; border-top: 1px solid #333; }
        .comments-section.active { display: block; }
        .comment { margin-bottom: 10px; font-size: 14px; }
        .comment-author { color: #6c5ce7; font-weight: 600; margin-right: 5px; cursor: pointer; }
        .comment-input-wrapper { display: flex; gap: 10px; margin-top: 15px; }
        .comment-input-wrapper input { flex-grow: 1; background: #111; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 6px; }

        /* Модалки */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal { background: #242424; padding: 30px; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid #444; max-height: 90vh; overflow-y: auto; }
        .modal h2 { margin-bottom: 20px; text-align: center; }
        .modal input, .modal textarea { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-family: inherit; }
        
        /* Telegram стиль чатов */
        .messages-layout { display: none; height: 600px; background: #242424; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
        .messages-layout.active { display: flex; }
        .chat-sidebar { width: 320px; border-right: 1px solid #333; display: flex; flex-direction: column; background: #1e1e1e;}
        .sidebar-header { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #2a2a2a; transition: 0.2s; }
        .chat-item:hover, .chat-item.active { background: #2a2a2a; }
        .chat-item-avatar { width: 40px; height: 40px; border-radius: 50%; background: #6c5ce7; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff;}
        .chat-item-info { flex: 1; overflow: hidden; }
        .chat-item-name { font-weight: 600; color: #fff; font-size: 14px; }
        .chat-item-last { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .chat-area-header { padding: 15px; border-bottom: 1px solid #333; font-weight: 600; display: flex; justify-content: space-between; align-items: center; background: #242424; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #1a1a1a; }
        .message { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .message.sent { background: #6c5ce7; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.received { background: #333; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { padding: 15px; border-top: 1px solid #333; display: flex; gap: 10px; background: #242424; }
        .chat-input-area input { flex: 1; background: #111; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; }

        /* Футер */
        .site-footer { text-align: center; padding: 30px 20px; margin-top: auto; border-top: 1px solid #333; background: #1e1e1e; }
        .footer-text { font-size: 14px; color: #666; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 50px; }
        .footer-text strong { color: #aaa; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header class="navbar">
        <a class="logo" onclick="switchTab('feed')">xnet<span>.id</span></a>
        <nav class="nav-links">
            <a id="nav-feed" class="active" onclick="switchTab('feed')">Лента</a>
            <a id="nav-messages" onclick="switchTab('messages')">Сообщения</a>
        </nav>
        <div class="nav-right" id="authArea">
            <!-- JS -->
        </div>
    </header>

    <!-- Основной контент -->
    <main class="container">
        
        <!-- Лента -->
        <div id="feedSection">
            <div class="create-post" id="createPostBox">
                <h3 style="margin-bottom: 15px;">Создать пост</h3>
                <textarea id="postContent" placeholder="О чем думаете?"></textarea>
                <div class="file-upload-wrapper">
                    <label>Прикрепить картинку: </label>
                    <input type="file" id="postImageFile" accept="image/*">
                </div>
                <button class="btn btn-primary" onclick="submitPost()">Опубликовать</button>
            </div>
            <div id="feed"></div>
        </div>

        <!-- Сообщения (Telegram Style) -->
        <div id="messagesSection" class="messages-layout">
            <!-- Сайдбар -->
            <div class="chat-sidebar">
                <div class="sidebar-header">
                    <h3>Чаты</h3>
                    <button class="btn btn-primary" id="createChatBtn" style="display:none; padding: 4px 8px; font-size: 12px;">+ Создать</button>
                </div>
                <div class="chat-list" id="chatList">
                    <!-- Сюда JS вставит список чатов -->
                </div>
            </div>
            <!-- Окно чата -->
            <div class="chat-area">
                <div class="chat-area-header" id="activeChatHeader">
                    <span>Выберите чат</span>
                </div>
                <div class="chat-messages" id="chatMessages">
                    <p style="color:#888; text-align:center; margin-top:20px;">Выберите чат из списка слева.</p>
                </div>
                <div class="chat-input-area" id="chatInputArea" style="display:none;">
                    <input type="text" id="chatInput" placeholder="Написать сообщение..." onkeypress="handleChatEnter(event)">
                    <button class="btn btn-primary" onclick="sendMessage()">Отправить</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Модалка Входа/Регистрации -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <h2 id="modalTitle">Вход в xnet</h2>
            <input type="text" id="authUsername" placeholder="Логин">
            <input type="password" id="authPassword" placeholder="Пароль">
            <button class="btn btn-primary" style="width: 100%; margin-bottom: 10px;" onclick="submitAuth()">Войти</button>
            <button class="btn" style="width: 100%;" onclick="toggleAuthMode()">Нет аккаунта? Регистрация</button>
        </div>
    </div>

    <!-- Модалка Редактора Профиля -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal">
            <h2>Редактор профиля</h2>
            <input type="text" id="editUsername" placeholder="Новое имя">
            <textarea id="editBio" placeholder="О себе..." rows="3"></textarea>
            <label style="font-size:12px; color:#888; display:block; margin-bottom:5px;">Аватар (URL):</label>
            <input type="text" id="editAvatar" placeholder="https://...">
            <button class="btn btn-primary" style="width: 100%; margin-bottom: 10px;" onclick="saveProfile()">Сохранить</button>
            <button class="btn" style="width: 100%;" onclick="closeModal('profileModal')">Отмена</button>
        </div>
    </div>

    <!-- Футер (Исправлен отступ) -->
    <footer class="site-footer">
        <div class="footer-text">
            <strong>СДЕЛАЛ</strong>
            <span>Color Soft</span>
        </div>
    </footer>

    <script>
        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let token = localStorage.getItem('xnet_token') || null;
        let currentUser = JSON.parse(localStorage.getItem('xnet_user')) || null;
        let isRegisterMode = false;
        let currentChatUser = null;
        
        // Мок-данные для чатов
        let mockChats = [
            { id: 1, name: 'ColorSoft', lastMsg: 'Привет, как дела?', avatar: 'C' },
            { id: 2, name: 'Admin', lastMsg: 'Добро пожаловать!', avatar: 'A' },
            { id: 3, name: 'Новости xnet', lastMsg: 'Обновление серверов', avatar: 'N' }
        ];
        let chatHistories = {
            1: [{text: 'Привет, как дела?', type: 'received'}],
            2: [{text: 'Добро пожаловать!', type: 'received'}],
            3: [{text: 'Обновление серверов', type: 'received'}]
        };

        // --- НАВИГАЦИЯ ---
        function switchTab(tab) {
            document.getElementById('nav-feed').classList.remove('active');
            document.getElementById('nav-messages').classList.remove('active');
            document.getElementById('feedSection').style.display = 'none';
            document.getElementById('messagesSection').classList.remove('active');

            if (tab === 'feed') {
                document.getElementById('nav-feed').classList.add('active');
                document.getElementById('feedSection').style.display = 'block';
            } else if (tab === 'messages') {
                if (!token) return alert('Войдите, чтобы просматривать сообщения');
                document.getElementById('nav-messages').classList.add('active');
                document.getElementById('messagesSection').classList.add('active');
                renderChats();
            }
        }

        // --- АВТОРИЗАЦИЯ И ПРОФИЛЬ ---
        function updateNavbar() {
            const authArea = document.getElementById('authArea');
            const createPostBox = document.getElementById('createPostBox');
            
            if (token && currentUser) {
                const avatarUrl = currentUser.avatar || `https://ui-avatars.com/api/?name=${currentUser.username}&background=6c5ce7&color=fff`;
                authArea.innerHTML = `
                    <div class="profile-menu-container">
                        <div class="profile-trigger" onclick="toggleDropdown(event)">
                            <img src="${avatarUrl}" alt="Avatar">
                            <span style="color:#fff; font-weight:600;">${currentUser.username}</span>
                        </div>
                        <div class="dropdown-menu" id="profileDropdown">
                            <a class="dropdown-item" onclick="openProfileEditor()">
                                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                                Редактор профиля
                            </a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" onclick="logout()" style="color: #ff4757;">
                                <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                                Выйти
                            </a>
                        </div>
                    </div>
                `;
                createPostBox.classList.add('active');
                
                // Проверка на админа (ColorSoft)
                if (currentUser.username.toLowerCase() === 'colorsoft') {
                    document.getElementById('createChatBtn').style.display = 'block';
                } else {
                    document.getElementById('createChatBtn').style.display = 'none';
                }

            } else {
                authArea.innerHTML = `<button class="btn btn-primary" onclick="openModal('authModal')">Войти</button>`;
                createPostBox.classList.remove('active');
                document.getElementById('createChatBtn').style.display = 'none';
            }
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('profileDropdown').classList.toggle('active');
        }

        window.addEventListener('click', function() {
            const dropdown = document.getElementById('profileDropdown');
            if (dropdown && dropdown.classList.contains('active')) dropdown.classList.remove('active');
        });

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // --- РЕДАКТОР ПРОФИЛЯ ---
        function openProfileEditor() {
            document.getElementById('editUsername').value = currentUser.username;
            document.getElementById('editBio').value = currentUser.bio || '';
            document.getElementById('editAvatar').value = currentUser.avatar || '';
            openModal('profileModal');
        }

        function saveProfile() {
            const newName = document.getElementById('editUsername').value.trim();
            const newBio = document.getElementById('editBio').value.trim();
            const newAvatar = document.getElementById('editAvatar').value.trim();
            
            if (!newName) return alert('Имя не может быть пустым');
            
            currentUser.username = newName;
            currentUser.bio = newBio;
            currentUser.avatar = newAvatar;
            
            localStorage.setItem('xnet_user', JSON.stringify(currentUser));
            updateNavbar();
            closeModal('profileModal');
            loadFeed(); // Обновить посты с новым именем
        }

        // --- АВТОРИЗАЦИЯ ---
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('modalTitle').innerText = isRegisterMode ? 'Регистрация' : 'Вход';
        }

        async function submitAuth() {
            const username = document.getElementById('authUsername').value;
            const password = document.getElementById('authPassword').value;
            const endpoint = isRegisterMode ? '/api/register' : '/api/login';

            try {
                // Для локального теста без сервера (имитация)
                if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
                     if(!username || !password) return alert('Введите логин и пароль');
                     token = 'mock_token'; currentUser = { username: username, id: 1 };
                     localStorage.setItem('xnet_token', token);
                     localStorage.setItem('xnet_user', JSON.stringify(currentUser));
                     closeModal('authModal'); updateNavbar(); loadFeed(); return;
                }

                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    token = data.token;
                    currentUser = data.user;
                    localStorage.setItem('xnet_token', token);
                    localStorage.setItem('xnet_user', JSON.stringify(currentUser));
                    closeModal('authModal');
                    updateNavbar();
                    loadFeed();
                } else {
                    alert(data.error);
                }
            } catch (e) { alert('Ошибка сервера'); }
        }

        function logout() {
            token = null; currentUser = null;
            localStorage.removeItem('xnet_token');
            localStorage.removeItem('xnet_user');
            updateNavbar();
            switchTab('feed');
        }

        // --- ПОСТЫ (С загрузкой файлов) ---
        async function loadFeed() {
            const feed = document.getElementById('feed');
            // Если мы локально без сервера, используем мок
            if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || !token) {
                feed.innerHTML = '<p style="text-align:center; color:#888;">Нет подключения к базе. Войдите или запустите сервер.</p>';
                return;
            }
            
            try {
                const res = await fetch('/api/posts');
                const posts = await res.json();
                feed.innerHTML = '';

                posts.forEach(post => {
                    const date = new Date(post.created_at).toLocaleString('ru-RU');
                    const imgHtml = post.image_url ? `<img src="${post.image_url}" class="post-img">` : '';
                    const isMyPost = currentUser && currentUser.username === post.username;
                    
                    feed.innerHTML += `
                        <article class="post">
                            <div class="post-header">
                                <div>
                                    <span class="post-author">@${post.username}</span>
                                </div>
                                <div style="display:flex; align-items:center; gap:15px;">
                                    <span>${date}</span>
                                    ${isMyPost ? `
                                    <button class="delete-post-btn" onclick="deletePost(${post.id})" title="Удалить пост">
                                        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                                    </button>` : ''}
                                </div>
                            </div>
                            ${imgHtml}
                            <div class="post-content">${post.content}</div>
                            <div class="post-footer">
                                <button class="action-btn" onclick="likePost(${post.id})">
                                    <img src="https://eblo.id/static/image/like.svg" alt="Like">
                                    <span id="likes-${post.id}">${post.likes_count}</span>
                                </button>
                                <button class="action-btn" onclick="toggleComments(${post.id})">
                                    <img src="https://eblo.id/static/image/comment.svg" alt="Comment">
                                    <span>${post.comments_count}</span>
                                </button>
                                <button class="action-btn" style="margin-left: auto; color: #6c5ce7;" onclick="switchTab('messages'); openSpecificChat('${post.username}')">
                                    <svg viewBox="0 0 24 24" style="fill:currentColor;"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
                                    Написать
                                </button>
                            </div>
                            <div class="comments-section" id="comments-${post.id}">
                                <div class="comments-list" id="comments-list-${post.id}"></div>
                                <div class="comment-input-wrapper">
                                    <input type="text" id="comment-input-${post.id}" placeholder="Написать комментарий...">
                                    <button class="btn btn-primary" onclick="addComment(${post.id})">Отправить</button>
                                </div>
                            </div>
                        </article>
                    `;
                });
            } catch (e) { feed.innerHTML = 'Ошибка загрузки ленты'; }
        }

        async function submitPost() {
            const content = document.getElementById('postContent').value;
            const fileInput = document.getElementById('postImageFile');
            const file = fileInput.files[0];

            if (!content) return alert('Напишите текст поста');

            let image_url = '';

            // Читаем файл, если он выбран
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    image_url = e.target.result; // Base64
                    await sendPostData(content, image_url);
                };
                reader.readAsDataURL(file);
            } else {
                await sendPostData(content, '');
            }
        }

        async function sendPostData(content, image_url) {
             try {
                const res = await fetch('/api/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ content, image_url })
                });

                if (res.ok) {
                    document.getElementById('postContent').value = '';
                    document.getElementById('postImageFile').value = '';
                    loadFeed();
                } else { alert('Ошибка при создании поста'); }
             } catch(e) { alert('Нет связи с сервером'); }
        }

        async function deletePost(id) {
            if (!confirm('Вы уверены, что хотите удалить этот пост?')) return;
            try {
                const res = await fetch(`/api/posts/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) loadFeed();
                else alert('Не удалось удалить пост');
            } catch(e) { alert('Ошибка сервера'); }
        }

        // --- ЧАТЫ (TG СТИЛЬ) ---
        function renderChats() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            mockChats.forEach(chat => {
                const isActive = currentChatUser === chat.name ? 'active' : '';
                list.innerHTML += `
                    <div class="chat-item ${isActive}" onclick="openSpecificChat('${chat.name}')">
                        <div class="chat-item-avatar">${chat.avatar}</div>
                        <div class="chat-item-info">
                            <div class="chat-item-name">${chat.name}</div>
                            <div class="chat-item-last">${chat.lastMsg}</div>
                        </div>
                    </div>
                `;
            });
        }

        function openSpecificChat(username) {
            // Ищем чат, если нет - создаем
            let chat = mockChats.find(c => c.name === username);
            if (!chat) {
                chat = { id: Date.now(), name: username, lastMsg: 'Нет сообщений', avatar: username.charAt(0).toUpperCase() };
                mockChats.unshift(chat);
                chatHistories[chat.id] = [];
            }

            currentChatUser = username;
            renderChats();
            
            document.getElementById('activeChatHeader').innerText = username;
            document.getElementById('chatInputArea').style.display = 'flex';
            
            // Рисуем историю
            const history = chatHistories[chat.id] || [];
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            if (history.length === 0) {
                chatMessages.innerHTML = `<p style="color:#888; text-align:center; margin-top:20px;">История пуста. Напишите первым!</p>`;
            } else {
                history.forEach(msg => {
                    chatMessages.innerHTML += `<div class="message ${msg.type}">${msg.text}</div>`;
                });
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            if (!currentChatUser) return;
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const chat = mockChats.find(c => c.name === currentChatUser);
            chat.lastMsg = text;
            
            chatHistories[chat.id].push({ text: text, type: 'sent' });
            
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML += `<div class="message sent">${text}</div>`;
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            renderChats(); // Обновить последнее сообщение в списке

            // Имитация ответа
            setTimeout(() => {
                const reply = "Автоответ: сообщение получено!";
                chatHistories[chat.id].push({ text: reply, type: 'received' });
                chat.lastMsg = reply;
                if (currentChatUser === chat.name) {
                    chatMessages.innerHTML += `<div class="message received">${reply}</div>`;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
                renderChats();
            }, 1500);
        }

        function handleChatEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
        
        // Создание чата (только для ColorSoft)
        document.getElementById('createChatBtn').onclick = () => {
            const name = prompt('Введите имя пользователя для нового чата:');
            if (name) {
                openSpecificChat(name);
            }
        };

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            updateNavbar();
            loadFeed();
        });
    </script>
</body>
</html>
